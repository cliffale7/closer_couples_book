<text x="72" y="150" fill="#FBF8F2" font-family="Georgia, 'Times New Roman', serif" font-size="12">A library of experiences for two adults</text>
<text x="72" y="166" fill="#FBF8F2" font-family="Georgia, 'Times New Roman', serif" font-size="12">who already like each other. Skip freely.</text>
<text x="72" y="182" fill="#FBF8F2" font-family="Georgia, 'Times New Roman', serif" font-size="12">Write what you want to keep.</text>
<text x="72" y="230" fill="#F6F1E7" font-family="Calibri, 'Segoe UI', sans-serif" font-size="9">01  The Art of Really Knowing Someone</text>
<text x="72" y="252" fill="#F6F1E7" font-family="Calibri, 'Segoe UI', sans-serif" font-size="9">02  Vulnerability and the Courage to Be Seen</text>
<text x="72" y="274" fill="#F6F1E7" font-family="Calibri, 'Segoe UI', sans-serif" font-size="9">03  The Science and Experience of Closeness</text>
<text x="72" y="296" fill="#F6F1E7" font-family="Calibri, 'Segoe UI', sans-serif" font-size="9">04  Love, Affection, and Feeling Chosen</text>
<text x="72" y="318" fill="#F6F1E7" font-family="Calibri, 'Segoe UI', sans-serif" font-size="9">05  Desire, Attraction, and Sensual Intimacy</text>
<text x="72" y="340" fill="#F6F1E7" font-family="Calibri, 'Segoe UI', sans-serif" font-size="9">06  Playfulness, Laughter, and a Little Mischief</text>
<text x="72" y="362" fill="#F6F1E7" font-family="Calibri, 'Segoe UI', sans-serif" font-size="9">07  The Inner World: Dreams, Meaning, and Identity</text>
<text x="72" y="384" fill="#F6F1E7" font-family="Calibri, 'Segoe UI', sans-serif" font-size="9">08  Trust, Communication, and Emotional Safety</text>
<text x="72" y="406" fill="#F6F1E7" font-family="Calibri, 'Segoe UI', sans-serif" font-size="9">09  Shared Adventures and New Experiences</text>
<text x="72" y="428" fill="#F6F1E7" font-family="Calibri, 'Segoe UI', sans-serif" font-size="9">10  The Past, the Present, and the Story of Us</text>
<text x="72" y="450" fill="#F6F1E7" font-family="Calibri, 'Segoe UI', sans-serif" font-size="9">11  Radical Curiosity and the Surprising Stuff</text>
<text x="72" y="472" fill="#F6F1E7" font-family="Calibri, 'Segoe UI', sans-serif" font-size="9">12  Building a Closer Future Together</text>
<text x="72" y="494" fill="#F6F1E7" font-family="Calibri, 'Segoe UI', sans-serif" font-size="9">13  The Inventor’s Workshop: Original Proposals</text>
